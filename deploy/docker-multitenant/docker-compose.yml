services:
  opa:
    image: openpolicyagent/opa:latest
    container_name: portcullis-mt-opa
    volumes:
      - ../../policies/rego:/policies
      - ./opa-config.yaml:/etc/opa/config.yaml:ro
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "--config-file=/etc/opa/config.yaml"
      - "--watch"
      - "--bundle"
      - "/policies/bundle.tar.gz"
    networks:
      - portcullis-mt

  redis:
    image: redis:7-alpine
    container_name: portcullis-mt-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-portcullis-dev-secret}", "--loglevel", "notice"]
    networks:
      - portcullis-mt

  keep:
    build:
      context: ../..
      dockerfile: deploy/docker-multitenant/Dockerfile
      target: keep
      args:
        VERSION: ${VERSION:-0.4.2-dev}
    container_name: portcullis-mt-keep
    volumes:
      - ./keep-demo.yaml:/etc/portcullis/keep.yaml:ro
    command: ["-config", "/etc/portcullis/keep.yaml"]
    depends_on:
      - opa
      - mock-enterprise-api
      - fetch-mcp
    networks:
      - portcullis-mt

  guard:
    build:
      context: ../..
      dockerfile: deploy/docker-multitenant/Dockerfile
      target: guard
      args:
        VERSION: ${VERSION:-0.4.2-dev}
    container_name: portcullis-mt-guard
    ports:
      - "8444:8444"  # approval UI — human opens this in their browser
      - "8445:8445"  # token API  — Gate calls this on the internal network
    volumes:
      - ./guard-demo.yaml:/etc/portcullis/guard.yaml:ro
    command: ["-config", "/etc/portcullis/guard.yaml"]
    depends_on:
      - redis
    networks:
      - portcullis-mt

  gate:
    build:
      context: ../..
      dockerfile: deploy/docker-multitenant/Dockerfile
      target: gate
      args:
        VERSION: ${VERSION:-0.4.2-dev}
    container_name: portcullis-mt-gate
    ports:
      - "9090:9090"
    volumes:
      - ./gate-demo.yaml:/etc/portcullis/gate.yaml:ro
    command: ["-config", "/etc/portcullis/gate.yaml"]
    depends_on:
      - keep
      - guard
      - redis
    networks:
      - portcullis-mt

  mock-enterprise-api:
    build:
      context: ../..
      dockerfile: deploy/docker-multitenant/Dockerfile
      target: mock-enterprise-api
    container_name: portcullis-mt-mock-enterprise-api
    networks:
      - portcullis-mt

  fetch-mcp:
    build:
      context: ../..
      dockerfile: deploy/docker-multitenant/Dockerfile
      target: fetch-mcp
    container_name: portcullis-mt-fetch-mcp
    networks:
      - portcullis-mt

networks:
  portcullis-mt:
    driver: bridge
