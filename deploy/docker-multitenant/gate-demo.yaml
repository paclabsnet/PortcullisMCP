# Portcullis Gate — multi-tenant demo configuration
#
# Gate runs as an HTTP service inside the compose stack.
# MCP clients connect to http://localhost:9090/mcp and present
# a bearer token in the Authorization header.
#
# See tokens/README.md for the demo tokens and what each one can do.

mode: dev

# the key differences with multi-tenancy are:
# 1) Portcullis runs standalone, and the Agents connect over the local network
# 2) multiple Agents can interact with Portcullis in parallel, each one supporting a
#    different human (the humans are the multiple tenants)
#
# The primary use case is when you're operating a fleet of AI Agents, and you want to give them some
# access to APIs or other tools, but you also want to make sure everything is captured, logged and
# authorized properly
#
tenancy: multi

# "session" partitions escalation state by the tenant's bearer-token session, so
# each user sees only their own pending approvals and escalation tokens.
# Use "fingerprint" to partition by OIDC credential fingerprint instead.
# Use "disabled" to turn off human-in-the-loop approval entirely.
escalation: session

server:
  endpoints:
    mcp:
      listen: "0.0.0.0:9090"
      auth:
        type: "bearer"
        credentials:
          header: "Authorization"
  session_ttl: 3600

#
# In multi-tenant:
#   No identity section provided — the Agent supplies a bearer token that Keep
#   validates against the IdP's JWKS endpoint.
#

peers:
  keep:
    endpoint: "http://keep:8080"
    auth:
      type: "bearer"
      credentials:
        bearer_token: "dev-secret-token"

  guard:
    endpoints:
      # approval_ui must be reachable by the human in their browser (host-facing).
      approval_ui: "http://localhost:8444"
      # token_api is called by Gate on the internal Docker network.
      token_api: "http://guard:8445"
    auth:
      type: "bearer"
      credentials:
        bearer_token: "dev-guard-token"

#
# Local filesystem tools are not available in multi-tenant mode (tenant isolation).
#
responsibility:
  tools:
    portcullis-localfs:
      enabled: false
  escalation:
    no_escalation_marker: "ESCALATION_DENIED"

operations:
  storage:
    backend: "redis"
    config:
      addr: "redis:6379"
      password: "portcullis-dev-secret"
      key_prefix: "portcullis:gate:"

  telemetry:
    exporter: "noop"
  logging:
    level: "debug"
    format: "text"
